name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify tag matches package version
        run: |
          node -e 'if (process.env.GITHUB_REF_NAME !== "v" + require("./package.json").version) throw new Error("Tag and package versions must match")'
      - name: Build userscript
        run: |
          npm run build-prod
          cp dist/ehunter.iife.js dist/ehunter-enhanced.user.js
          node --check dist/ehunter-enhanced.user.js
      - name: Drop throwaway releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 1.2.7 之后那几版是反复试错的中间态，其中两版还会让 nhentai 初始化失败，
          # 内容已经合并回 1.2.7，这里把它们的 release 和 tag 一起清掉。
          # 只清理固定列表，不碰其它版本。
          for v in v1.2.8 v1.2.9 v1.2.10 v1.2.11; do
            if [ "$v" != "$GITHUB_REF_NAME" ]; then
              gh release delete "$v" --yes --cleanup-tag 2>/dev/null && echo "removed $v" || true
            fi
          done
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 同一个版本重发时先删掉旧 release，否则 gh release create 会报已存在
          gh release delete "$GITHUB_REF_NAME" --yes 2>/dev/null || true
          gh release create "$GITHUB_REF_NAME" \
            dist/ehunter-enhanced.user.js \
            --verify-tag --latest --generate-notes \
            --title "eHunter Enhanced $GITHUB_REF_NAME"
